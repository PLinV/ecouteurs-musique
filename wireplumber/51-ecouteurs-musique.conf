# Écouteurs Bluetooth "sucker de qeue" : toujours en mode musique (A2DP)

wireplumber.settings = {
  # Ne pas basculer en mode appel (son mono) quand une appli ouvre le micro
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "bluez_card.04_C8_B0_2E_23_A7" } ]
    actions = {
      update-props = {
        # À la connexion, n'activer que le profil musique
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
]
